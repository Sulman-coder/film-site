
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Odyssey - Poster Gallery</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
  <style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090b0e;
  color: #f2f0e9;
  font-family: Arial, Helvetica, sans-serif;
  padding: 35px 20px;
}

.gallery-page {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.page-header {
  text-align: center;
  margin-bottom: 35px;
}

.eyebrow {
  color: #c8a96b;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 14px;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 400;
  line-height: 1.2;
}

h1 span {
  display: block;
  color: #c8a96b;
  font-style: italic;
}

.intro {
  color: #a6a7a5;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 14px;
}

.poster-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.poster-card {
  position: relative;
  min-width: 0;
  overflow: hidden;
  padding: 10px;
  background: #111419;
  border: 1px solid #292e34;
  border-radius: 8px;
}

.poster-number {
  display: block;
  color: #c8a96b;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.poster-card img {
  display: block;
  width: 100%;
  height: 350px;
  object-fit: contain;
  background: #080a0d;
  border-radius: 4px;
}

.poster-card:hover {
  border-color: #c8a96b;
  transition: border-color 0.3s ease;
}

footer {
  margin-top: 35px;
  padding-top: 18px;
  border-top: 1px solid #292e34;
  color: #858a90;
  text-align: center;
  font-size: 11px;
  letter-spacing: 2px;
  line-height: 1.8;
}






.poster-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.poster-card {
  min-width: 0;
  padding: 6px;
  overflow: hidden;
}

.poster-number {
  font-size: 10px;
  margin-bottom: 5px;
}

.poster-card img {
  display: block;
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #080a0d;
  border-radius: 4px;
}

/* Tablet and mobile */
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .page-header {
    margin-bottom: 15px;
  }

  .poster-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .poster-card {
    padding: 4px;
  }

  .poster-card img {
    height: 100px;
  }

  footer {
    margin-top: 15px;
    padding-top: 10px;
  }
}



/* Tablet */
@media (max-width: 800px) {
  .poster-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .poster-card img {
    height: 320px;
  }
}

/* Mobile */
@media (max-width: 480px) {
  body {
    padding: 24px 12px;
  }

  .poster-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .poster-card {
    padding: 6px;
  }

  .poster-card img {
    height: 210px;
  }

  .page-header {
    margin-bottom: 24px;
  }
}

  </style>
</head>
<body>

  <main class="gallery-page">
    <header class="page-header">
      <p class="eyebrow">VISUAL JOURNAL</p>
      <h1>The Odyssey <span>Poster Gallery</span></h1>
      <p class="intro">
        Six cinematic artworks inspired by the legendary voyage.
      </p>
    </header>

    <section class="poster-grid">

      <article class="poster-card">
        <span class="poster-number">01</span>
        <img src="poster-1.png" alt="The Odyssey poster 1">
      </article>

      <article class="poster-card">
        <span class="poster-number">02</span>
        <img src="poster-2.png" alt="The Odyssey poster 2">
      </article>

      <article class="poster-card">
        <span class="poster-number">03</span>
        <img src="poster-3.png" alt="The Odyssey poster 3">
      </article>

      <article class="poster-card">
        <span class="poster-number">04</span>
        <img src="poster-4.jpg" alt="The Odyssey poster 4">
      </article>

      <article class="poster-card">
        <span class="poster-number">05</span>
        <img src="poster-5.jpg" alt="The Odyssey poster 5">
      </article>

      <article class="poster-card">
        <span class="poster-number">06</span>
        <img src="poster-6.jpg" alt="The Odyssey poster 6">
      </article>

    </section>

    <footer>
      THE ODYSSEY · CINEMATIC VISUAL COLLECTION
    </footer>
  </main>

</body>
</html>
